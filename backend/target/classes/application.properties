spring.application.name=overcode-market

# PostgreSQL datasource configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/overcode
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Springdoc
springdoc.swagger-ui.path=/swagger-ui.html

# JWT configuration (secret should be overridden in production via environment variable)
jwt.secret=change-me-in-dev-with-at-least-256-bits-length
# 24 hours in milliseconds (24*60*60*1000)
jwt.expiration=86400000
