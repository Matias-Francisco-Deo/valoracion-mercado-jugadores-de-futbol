spring.application.name=overcode-market

# PostgreSQL datasource configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/overcode
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/indexes.sql
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=true

# Springdoc
springdoc.swagger-ui.path=/swagger-ui.html

#Cache
spring.cache.type=simple
spring.cache.cache-names=ranking

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.cache.interceptor=TRACE

# JWT configuration (secret should be overridden in production via environment variable)
jwt.secret=change-me-in-dev-with-at-least-256-bits-length
# 24 hours in milliseconds (24*60*60*1000)
jwt.expiration=86400000

football-data.api-key=${FOOTBALL_DATA_API_KEY:}
football-data.base_url=https://api.football-data.org/v4

superuser.name=${SUPERUSER_NAME:superuser}
superuser.email=${SUPERUSER_EMAIL:overcode@gmail.com}
superuser.password=${SUPERUSER_PASSWORD:overcodesuperuser}

# Scraper Admin API Key
scraper.api.key=${SCRAPER_API_KEY:default-dev-scraper-key-change-me}