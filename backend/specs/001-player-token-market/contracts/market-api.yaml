openapi: 3.0.3
info:
  title: Player Token Market API
  version: 1.0.0
  description: REST contract for football-player token trading, portfolio, and transaction history.
servers:
  - url: http://localhost:8080
paths:
  /players:
    get:
      summary: List players with optional filters
      parameters:
        - in: query
          name: league
          schema:
            type: string
        - in: query
          name: team
          schema:
            type: string
        - in: query
          name: position
          schema:
            type: string
      responses:
        '200':
          description: Player catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerSummary'

  /players/{id}:
    get:
      summary: Get player details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Player detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/buy:
    post:
      summary: Buy tokens from a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyOrderRequest'
      responses:
        '200':
          description: Trade accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /orders/sell:
    post:
      summary: Sell tokens from a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellOrderRequest'
      responses:
        '200':
          description: Trade accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{id}/portfolio:
    get:
      summary: Get user portfolio
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/transactions:
    get:
      summary: Get user transaction history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  responses:
    BadRequest:
      description: Invalid request payload or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested entity not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Trade cannot be processed because of state or inventory constraints
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    PlayerSummary:
      type: object
      required: [id, name, currentPrice, totalIssued]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        currentPrice:
          type: integer
        totalIssued:
          type: integer

    PlayerDetail:
      allOf:
        - $ref: '#/components/schemas/PlayerSummary'
        - type: object
          properties:
            availableTokens:
              type: integer
            league:
              type: string
              nullable: true
            team:
              type: string
              nullable: true
            position:
              type: string
              nullable: true

    BuyOrderRequest:
      type: object
      required: [buyerId, sellerId, playerId, quantity]
      properties:
        buyerId:
          type: integer
          format: int64
        sellerId:
          type: integer
          format: int64
        playerId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    SellOrderRequest:
      type: object
      required: [sellerId, buyerId, playerId, quantity]
      properties:
        sellerId:
          type: integer
          format: int64
        buyerId:
          type: integer
          format: int64
        playerId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    TradeResponse:
      type: object
      required: [transactionId, buyerId, sellerId, playerId, quantity, unitPrice, totalAmount]
      properties:
        transactionId:
          type: integer
          format: int64
        buyerId:
          type: integer
          format: int64
        sellerId:
          type: integer
          format: int64
        playerId:
          type: integer
          format: int64
        quantity:
          type: integer
        unitPrice:
          type: integer
        totalAmount:
          type: integer
        timestamp:
          type: string
          format: date-time

    PortfolioResponse:
      type: object
      required: [userId, creditBalance, positions]
      properties:
        userId:
          type: integer
          format: int64
        creditBalance:
          type: integer
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionEntry'

    PositionEntry:
      type: object
      required: [playerId, quantity]
      properties:
        playerId:
          type: integer
          format: int64
        quantity:
          type: integer

    TransactionResponse:
      type: object
      required: [id, timestamp, type, buyerId, sellerId, playerId, quantity, unitPrice, totalAmount]
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum: [BUY, SELL]
        buyerId:
          type: integer
          format: int64
          nullable: true
        sellerId:
          type: integer
          format: int64
          nullable: true
        playerId:
          type: integer
          format: int64
        quantity:
          type: integer
        unitPrice:
          type: integer
        totalAmount:
          type: integer

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
