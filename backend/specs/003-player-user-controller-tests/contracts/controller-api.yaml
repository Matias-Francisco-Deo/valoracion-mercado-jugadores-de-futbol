openapi: 3.0.3
info:
  title: Player and User Controller API Contract
  version: 1.0.0
  description: HTTP API contract for Player and User endpoints covered by the controller test suite.
paths:
  /players:
    get:
      summary: Retrieve all registered players
      description: Returns a list of all players registered in the catalog. Requires Bearer token authentication.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful retrieval of players list (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerResponse'
        '401':
          description: Unauthenticated request or expired token.
        '403':
          description: Access forbidden (missing or invalid token).

  /players/{id}:
    get:
      summary: Retrieve player by unique ID
      description: Returns the player matching the given identifier. Requires Bearer token authentication.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Player found and returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '400':
          description: Malformed or invalid identifier supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated request or expired token.
        '403':
          description: Access forbidden (missing or invalid token).
        '404':
          description: Player not found for the given identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    get:
      summary: Retrieve user public profile by unique ID
      description: Returns public profile information for the specified user ID. Requires Bearer token authentication.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: User profile found and returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Malformed or invalid identifier supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated request or expired token.
        '403':
          description: Access forbidden (missing or invalid token).
        '404':
          description: User not found for the given identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PlayerResponse:
      type: object
      required:
        - id
        - name
        - currentPrice
        - tokens
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Lionel Messi"
        currentPrice:
          type: integer
          example: 100
        tokens:
          type: array
          items:
            type: integer
            format: int64
          example: [101, 102, 103]

    UserResponse:
      type: object
      required:
        - id
        - username
        - email
        - creditBalance
        - tokens
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: "user1"
        email:
          type: string
          format: email
          example: "user1@example.com"
        creditBalance:
          type: integer
          example: 1000
        tokens:
          type: array
          items:
            type: integer
            format: int64
          example: [201, 202]

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Entidad no encontrada"
